name: Scheduled supply-chain audit

# OPS-CI-02: cargo-audit / cargo-deny only ran on PR/push, so a new RustSec
# advisory against an already-locked dependency went unnoticed until the next
# code change — leaving a known-vulnerable dep deployed. This job runs the same
# advisories + license/ban checks on a daily schedule (and on manual dispatch)
# so a fresh advisory is caught within a day regardless of commit cadence.
on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same pinned versions as ci.yml (OPS-CI-01). cargo-audit >= 0.22.0 for
      # CVSS 4.0 advisory support.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-deny (advisories + licenses + bans)
        run: cargo deny check
