name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege: this workflow only reads code (no releases, deploys, or PR
# comments). Explicit `permissions` overrides the default GITHUB_TOKEN scope.
permissions:
  contents: read

# Repeated pushes to the same branch cancel the in-flight run, so a fast
# follow-up commit doesn't queue a redundant ~10-15 min Rust build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --workspace --release

      - name: Test (default features, hermetic — `live` off)
        run: cargo test --workspace

  # Feature-gated crates: compile-check each optional backend. These need no
  # external service to build (only to *run*), so they belong in CI.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: redis store
        run: cargo clippy -p hkgov-store --features redis --all-targets -- -D warnings
      - name: pg store
        run: cargo clippy -p hkgov-store --features pg --all-targets -- -D warnings
      - name: otel
        run: cargo clippy -p hkgov-common --features otel --all-targets -- -D warnings
      - name: llm (agent)
        run: cargo clippy -p hkgov-agent --features llm --all-targets -- -D warnings
      # alerts (agent): the EmailSink + webhook dispatch path is gated behind
      # `#[cfg(feature = "alerts")]` (crates/agent/src/alerts.rs). Without this
      # step the dispatch codepath is never compiled in CI, so a breakage there
      # would ship green. This closes the gap surfaced in the persona review.
      - name: alerts (agent)
        run: cargo clippy -p hkgov-agent --features alerts --all-targets -- -D warnings
