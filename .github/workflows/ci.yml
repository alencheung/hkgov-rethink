name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege: this workflow only reads code (no releases, deploys, or PR
# comments). Explicit `permissions` overrides the default GITHUB_TOKEN scope.
permissions:
  contents: read

# Repeated pushes to the same branch cancel the in-flight run, so a fast
# follow-up commit doesn't queue a redundant ~10-15 min Rust build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --workspace --release

      - name: Test (default features, hermetic — `live` off)
        run: cargo test --workspace

  # Feature-gated crates: compile-check each optional backend. These need no
  # external service to build (only to *run*), so they belong in CI.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: redis store
        run: cargo clippy -p hkgov-store --features redis --all-targets -- -D warnings
      - name: pg store
        run: cargo clippy -p hkgov-store --features pg --all-targets -- -D warnings
      - name: otel
        run: cargo clippy -p hkgov-common --features otel --all-targets -- -D warnings
      - name: llm (agent)
        run: cargo clippy -p hkgov-agent --features llm --all-targets -- -D warnings
      # alerts (agent): the EmailSink + webhook dispatch path is gated behind
      # `#[cfg(feature = "alerts")]` (crates/agent/src/alerts.rs). Without this
      # step the dispatch codepath is never compiled in CI, so a breakage there
      # would ship green. This closes the gap surfaced in the persona review.
      - name: alerts (agent)
        run: cargo clippy -p hkgov-agent --features alerts --all-targets -- -D warnings
      # Every feature enabled at once. Catches cross-feature interaction bugs
      # (e.g. two features defining the same item under different cfgs) that the
      # single-feature steps above can't surface.
      - name: Clippy all features
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Security scanning: cargo-audit (RustSec advisory DB) + cargo-deny (license,
  # advisories, bans, sources). Kept as its own job so an advisory finding fails
  # the build independently of the fmt/clippy/test job's result.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # OPS-CI-01: pin the scanner tool VERSIONS (not just --locked, which only
      # pins the tool's own dependency lockfile). An unpinned `cargo install`
      # floats to latest on every run, so a yanked/compromised version could
      # silently skip the security scan or fail nondeterministically. taiki-e's
      # installer fetches a specific release by tag. Bump these explicitly when
      # upgrading; the versions track recent stable releases.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.21.2,cargo-deny@0.16.3
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-deny
        run: cargo deny check

  # Python client tests. The typed client (hkgov-py) is part of the public
  # surface; without this job, a Python-side regression (e.g. D-011 coverage
  # gaps or a response-shape mismatch) ships green because the Rust-only job
  # never imports the client.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client + dev deps
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src
      - name: Test
        run: pytest tests/ -v

  # Live integration smoke: boots the real server against live HKGOV data and
  # asserts the flagship endpoints return non-empty results. This is the test
  # the fourth audit (D-012) identified as the missing guard — hermetic unit
  # tests with seeded stores missed a slug rename that broke the live pipeline.
  #
  # `continue-on-error: true` because the HKGOV upstreams are rate-limited free
  # endpoints with occasional outages; a transient upstream failure should NOT
  # block a PR. The job still *runs* on every push, so a real regression (empty
  # insights, broken connector) surfaces in the Actions log rather than silently
  # shipping.
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p hkgov-api
      - name: Boot server + smoke-test flagship endpoints
        env:
          HKGOV_AGENT__ENABLED: "true"
          HKGOV_API__BIND: "0.0.0.0:8099"
        run: |
          ./target/release/hkgov-api &
          SERVER_PID=$!
          # Wait for the server to be ready (up to 120s).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8099/health > /dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 2
          done
          # Health must respond.
          curl -sf http://localhost:8099/health | grep -q '"status"'
          # Sources must be non-empty (connectors wired + catalog loaded).
          SOURCE_COUNT=$(curl -sf http://localhost:8099/v1/sources | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
          echo "Source count: $SOURCE_COUNT"
          if [ "$SOURCE_COUNT" -lt 10 ]; then
            echo "WARNING: source count ($SOURCE_COUNT) is below 10 — connectors may not have warmed"
          fi
          # Categories must be non-empty.
          curl -sf http://localhost:8099/v1/categories | python3 -c "import sys,json; assert len(json.load(sys.stdin)) > 0" 2>/dev/null
          # Dashboard must be served.
          curl -sf http://localhost:8099/dashboard | grep -q "HK City Pulse"
          # Scan-target validation: no boot errors about unknown slugs in the
          # server log (this is the D-012 guard — if a slug drifts, the boot
          # emits an error log line).
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "Live smoke test passed"
