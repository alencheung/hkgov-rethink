# cargo-deny configuration.
#
# Without this file, `cargo deny check` falls back to a default config whose
# license allowlist is empty — so every dependency's license is "not explicitly
# allowed" and the check fails. This config allows the standard permissive
# licenses our dependencies use (MIT, Apache-2.0, BSD variants, ISC, Unicode,
# Zlib/Apache-2.0, MPL-2.0, CC0). The advisories/bans/sources checks already
# pass with their defaults; only licenses needed an explicit allowlist.

[advisories]
# Use cargo-audit's advisory DB (the default). cargo-deny's own advisories
# check already passes; no version-floor overrides needed.
version = 2
yanked = "deny"

[bans]
# Default config is fine (no duplicate crates, no wildcard deps). The check
# already passes.
multiple-versions = "warn"
wildcards = "allow"

[licenses]
# Allow the permissive licenses our dependencies declare. SPDX identifiers.
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
# Confidence threshold for license detection from Cargo.toml. The default
# (0.8) is fine.
confidence-threshold = 0.8

[sources]
# Only allow crates from crates.io (the default). No private registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
