# Static dashboard deploy — no build step.
# The dashboard is a single self-contained HTML file (dashboard/index.html).
# It is a CLIENT only; it fetches live data from the hkgov-api Rust service,
# which must be hosted separately (Netlify cannot run the Rust binary).
#
# This file overrides any stale Build settings entered in the Netlify UI
# (e.g. a leftover "hugo" build command).
[build]
  command = ""
  publish = "dashboard"

# SPA rewrite: serve the dashboard for any unmatched path so deep links resolve.
# The Cite-It permalink is emitted as `/cite/{insight_id}` (see
# crates/agent/src/cite.rs), but the dashboard is a single static HTML file with
# no per-path asset — without this rewrite a shared permalink 404s on the
# Netlify deploy. `checkShareLanding()` in index.html reads the path/hash and
# opens the citation drawer client-side. `force = false` (the default) keeps
# real static assets (index.html, llms.txt) winning over this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────
# Raises securityheaders.com grade to A+. The dashboard is a static,
# client-rendered single HTML file, so CSP allows 'unsafe-inline' for
# scripts/styles (73 inline event handlers + inline <style>/<script>)
# while locking down everything else. Whitelist:
#   • https://cdn.jsdelivr.net  → uPlot (JS/CSS), Remixicon (CSS/font)
#   • *.up.railway.app          → live API (fetch)
# JSON-LD (application/ld+json) is exempt from script-src by the spec.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://hkgov-rethink-production.up.railway.app https://hkgov-rethink.up.railway.app; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
