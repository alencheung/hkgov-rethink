[package]
name = "hkgov-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Enable tests that hit live HKGOV endpoints (not run in CI).
live = []

[dependencies]
hkgov-common.workspace = true
# M1 lineage: the Connector trait exposes upstream_url()/upstream_format() so the
# ingest supervisor can record provenance. Only the UpstreamFormat enum is used
# (no store runtime), keeping the dependency surface minimal.
hkgov-store.workspace = true
reqwest.workspace = true
# Stream iteration for the size-limited response reader (`limited.rs`). reqwest's
# `stream` feature yields `impl Stream`; we need `StreamExt::next` to drain it.
futures-util = "0.3"
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
url.workspace = true
chrono.workspace = true
csv.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
