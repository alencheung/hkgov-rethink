# Railway Config as Code. See https://docs.railway.com/config-as-code/reference
#
# Railway auto-detects ./Dockerfile and builds it (no builder block needed).
# This file only declares the deploy-time behavior: the healthcheck path the
# proxy polls and the restart policy. The binary honors Railway's injected
# `PORT` env var at runtime (see crates/api/src/main.rs), so no explicit
# startCommand or port mapping is required here.
#
# REQUIRED VARIABLES (set in Railway → Variables, or under [deploy] below via
# railway variables — these are NOT committed defaults for security reasons):
#   PORT                          — Railway injects this; do NOT override.
#   HKGOV_API__CORS_ORIGINS       — JSON-array string, e.g.
#                                   ["https://hkgov-rethink.netlify.app"]
#                                   (the dashboard origin). Without it the
#                                   default same-origin CORS policy blocks the
#                                   Netlify dashboard's requests.
#   HKGOV_API__API_KEY            — a strong secret. Without it every endpoint
#                                   is anonymous; the dashboard must then send
#                                   the same value in its X-API-Key field.
#   HKGOV_API__RATE_PER_SEC       — e.g. 20. Default 0 is an unsafe production
#                                   value (no flood protection).
#   HKGOV_AGENT__ENABLED          — true, so insights + the Silence Index
#                                   actually populate.

[deploy]
# /ready (not /health) folds in circuit-breaker state + warm cache, so a
# degraded container stops receiving traffic. Matches the Dockerfile HEALTHCHECK.
healthcheckPath = "/ready"
healthcheckTimeout = 30
# Sleep before the first probe to cover the release-build cold start + the
# initial cache warm-up pass.
startPeriodSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
