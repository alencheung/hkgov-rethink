<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="hkgov-rethink — agentic monitoring that surfaces what the HKGOV press room leaves unsaid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0a1a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5306b"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3da9fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3da9fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1d2c47" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- data series line: a steady baseline with a sharp spike + a gap -->
  <path d="M40 220 L160 214 L300 210 L440 205 L560 208 L680 90 L820 60 L960 212 L1100 209 L1160 207"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- spike annotation -->
  <circle cx="680" cy="90" r="6" fill="#ff8a3d"/>
  <circle cx="820" cy="60" r="6" fill="#ff8a3d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ff8a3d">
    <text x="700" y="74">+99.3% · unattributed</text>
  </g>

  <!-- gap marker (missing press release) -->
  <g>
    <rect x="952" y="40" width="16" height="200" fill="#f5306b" opacity="0.12"/>
    <text x="976" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f5306b">press gap</text>
  </g>

  <!-- title block -->
  <text x="40" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="#e8eefc">hkgov&#8209;rethink</text>
  <rect x="40" y="76" width="320" height="4" fill="url(#accent)"/>
  <text x="40" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9fb2d4">Agentic monitoring that surfaces what the</text>
  <text x="40" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9fb2d4">HKGOV press room leaves unsaid.</text>

  <!-- badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <rect x="40"  y="266" width="150" height="28" rx="14" fill="none" stroke="#2a3c5e"/>
    <text x="58" y="284" fill="#7fd1ff">100% Rust · deterministic</text>

    <rect x="200" y="266" width="118" height="28" rx="14" fill="none" stroke="#2a3c5e"/>
    <text x="218" y="284" fill="#7fd1ff">no API key needed</text>

    <rect x="328" y="266" width="150" height="28" rx="14" fill="none" stroke="#2a3c5e"/>
    <text x="346" y="284" fill="#7fd1ff">7 connectors · live data</text>
  </g>
</svg>
